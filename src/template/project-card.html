<a class="project-card" href="projects/{{SLUG}}.html" aria-label="View {{TITLE}} project details">
  <div class="project-media">
    <img src="{{IMG}}" alt="{{TITLE}} Screenshot" class="project-img">
    {{STATUS_BADGE}}
  </div>
  <div class="project-content">
    <div class="project-meta">
      <h2>{{TITLE}}</h2>
      <span class="project-period">{{PERIOD}}</span>
    </div>
    <p class="project-summary">{{SUMMARY}}</p>
    <div class="project-footer">
      <div class="tag-list">{{TAGS_HTML}}</div>
      <span class="card-cta">View details <i class="fa-solid fa-arrow-right"></i></span>
    </div>
  </div>
</a>
