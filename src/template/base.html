<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | David Quayartey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{BASE}}assets/style.css">
</head>
<body>

  {{NAV}}

  <div class="page-wrapper">
    {{SIDEBAR}}

    <div class="content-area">
      <main class="container">
        {{CONTENT}}
      </main>
    </div>
  </div>

  {{FOOTER}}

  <script>
    // ── Active nav pill ──
    const currentPage = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-links a').forEach(a => {
      if (a.getAttribute('href') === currentPage) a.classList.add('active');
    });

    // ── Sidebar toggle ──
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');
    if (sidebar && toggleBtn) {
      toggleBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
    }

    // ── Sidebar active link on scroll ──
    const sidebarLinks = document.querySelectorAll('.sidebar-nav a');
    if (sidebarLinks.length) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            sidebarLinks.forEach(l => l.classList.remove('active'));
            const match = document.querySelector(`.sidebar-nav a[href="#${e.target.id}"]`);
            if (match) match.classList.add('active');
          }
        });
      }, { rootMargin: '-30% 0px -60% 0px' });
      document.querySelectorAll('.section-anchor').forEach(s => observer.observe(s));
    }
  </script>

</body>
</html>
